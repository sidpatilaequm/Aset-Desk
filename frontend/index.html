<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Asset Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Archivo+Narrow:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --sunk:#E9EDF2; --ink:#16213A; --muted:#5A6579; --line:#D9DFE7;
  --accent:#1D5BD8; --accent-ink:#FFFFFF; --tag:#F5C518; --tag-ink:#1B1A12;
  --ok:#1E8E5A; --warn:#A86A12; --bad:#C2413A; --info:#1D5BD8;
  --ok-bg:#E3F4EB; --warn-bg:#FBF0DC; --bad-bg:#FBE6E4; --info-bg:#E4ECFB;
  --radius:10px; --font:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --narrow:"Archivo Narrow","Arial Narrow",system-ui,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F141D; --surface:#171F2C; --sunk:#1E2838; --ink:#E6EAF2; --muted:#9AA5B8; --line:#2A3548;
    --accent:#7EA4FF; --accent-ink:#0F141D; --ok:#5CCB93; --warn:#E8B35A; --bad:#F08A80; --info:#7EA4FF;
    --ok-bg:#16322A; --warn-bg:#35291A; --bad-bg:#3A1F1E; --info-bg:#1B2A47; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F141D; --surface:#171F2C; --sunk:#1E2838; --ink:#E6EAF2; --muted:#9AA5B8; --line:#2A3548;
  --accent:#7EA4FF; --accent-ink:#0F141D; --ok:#5CCB93; --warn:#E8B35A; --bad:#F08A80; --info:#7EA4FF;
  --ok-bg:#16322A; --warn-bg:#35291A; --bad-bg:#3A1F1E; --info-bg:#1B2A47; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
h1{font-size:1.6rem;line-height:1.2;margin:0 0 .25rem;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.1rem;margin:0 0 .75rem;font-weight:600}
h3{font-size:.95rem;margin:0 0 .5rem;font-weight:600}
p{margin:0 0 .75rem}
.muted{color:var(--muted)}
.small{font-size:.85rem}

/* shell */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);padding:1.25rem 1rem;display:flex;flex-direction:column;gap:1rem;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:.6rem;font-weight:700;font-size:1.05rem}
.brand .mark{width:30px;height:22px;background:var(--tag);border-radius:3px;display:grid;place-items:center;color:var(--tag-ink);font:700 .7rem var(--narrow)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;justify-content:space-between;align-items:center;padding:.5rem .7rem;border-radius:8px;text-decoration:none;color:var(--ink);font-weight:500}
.nav a:hover{background:var(--sunk)}
.nav a.on{background:var(--ink);color:var(--surface)}
.nav .count{font-size:.75rem;background:var(--sunk);color:var(--ink);border-radius:20px;padding:0 .45rem}
.nav a.on .count{background:var(--surface);color:var(--ink)}
.whoami{margin-top:auto;border-top:1px solid var(--line);padding-top:1rem;font-size:.85rem}
.whoami .name{font-weight:600}
.main{padding:1.75rem 2rem 4rem;min-width:0;max-width:1180px}
.pagehead{display:flex;flex-wrap:wrap;gap:1rem;align-items:flex-end;justify-content:space-between;margin-bottom:1.25rem}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;top:0;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:.6rem .8rem;z-index:5;border-right:0;border-bottom:1px solid var(--line);top:env(safe-area-inset-top,0px)}
  .nav{flex-direction:row;overflow-x:auto;flex:1 1 100%;order:3}
  .nav a{white-space:nowrap}
  .whoami{margin:0 0 0 auto;border:0;padding:0;text-align:right}
  .whoami .hide-sm{display:none}
  .main{padding:1.25rem 1rem 4rem}
}

/* bits */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:1.1rem 1.2rem}
.grid{display:grid;gap:1rem}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:860px){.g2,.g3{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.btn{display:inline-flex;align-items:center;gap:.4rem;border:1px solid var(--line);background:var(--surface);padding:.5rem .9rem;border-radius:8px;cursor:pointer;font-weight:600;text-decoration:none;color:var(--ink);font-size:.9rem}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.spacer{flex:1}
label.f{display:flex;flex-direction:column;gap:.3rem;font-size:.85rem;font-weight:500;color:var(--muted)}
.f input,.f select,.f textarea,.inp{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:.5rem .6rem;color:var(--ink);font-size:.95rem;width:100%}
.f textarea{min-height:90px;resize:vertical}
.f input:disabled,.f select:disabled{opacity:.6}
.check{display:flex;gap:.5rem;align-items:center;font-size:.9rem}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:.6rem .75rem;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:.8rem;background:var(--sunk)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
tbody tr.link{cursor:pointer}
tbody tr.link:hover td{background:var(--sunk)}
tfoot td{font-weight:700;background:var(--sunk)}
.pill{display:inline-block;padding:.1rem .55rem;border-radius:20px;font-size:.78rem;font-weight:600;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok)}.p-warn{background:var(--warn-bg);color:var(--warn)}
.p-bad{background:var(--bad-bg);color:var(--bad)}.p-info{background:var(--info-bg);color:var(--info)}
.p-mute{background:var(--sunk);color:var(--muted)}
.notice{border-left:3px solid var(--accent);background:var(--info-bg);padding:.7rem .9rem;border-radius:6px;font-size:.9rem;margin-bottom:1rem}
.notice.warn{border-color:var(--warn);background:var(--warn-bg)}
.notice.bad{border-color:var(--bad);background:var(--bad-bg)}
.empty{padding:2rem;text-align:center;color:var(--muted)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:.35rem 1rem;font-size:.9rem}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:500;min-width:0;overflow-wrap:anywhere}
.figs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:1rem}
.figs>div{padding:.9rem 1.1rem;background:var(--surface);min-width:0}
.figs.f3{grid-template-columns:repeat(3,minmax(0,1fr))}
.figs.f6{grid-template-columns:repeat(6,minmax(0,1fr))}
.figs b{display:block;font-size:1.35rem;font-weight:700;letter-spacing:-.01em;overflow-wrap:anywhere}
.figs span{font-size:.82rem;color:var(--muted)}
@media (max-width:860px){.figs{grid-template-columns:repeat(2,minmax(0,1fr))}.figs.f6{grid-template-columns:repeat(3,minmax(0,1fr))}.figs.f3 b{font-size:1.05rem}}
.bar{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.tabs{display:flex;gap:.25rem;border-bottom:1px solid var(--line);margin-bottom:1rem;overflow-x:auto}
.tabs button{border:0;background:none;padding:.55rem .85rem;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-color:var(--ink)}

/* the asset tag: printed property label */
.atag{display:inline-flex;align-items:stretch;background:var(--tag);color:var(--tag-ink);border-radius:3px;font:700 .82rem/1 var(--narrow);letter-spacing:.02em;overflow:hidden;vertical-align:middle;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.atag span{padding:.28rem .45rem}
.atag svg{background:#fff;display:block;padding:2px 4px;height:auto}
.atag.big{font-size:1.15rem}
.atag.big span{padding:.5rem .7rem}

/* timeline */
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;padding:0 0 1rem 1.3rem;border-left:2px solid var(--line);margin-left:.4rem}
.tl li:last-child{border-color:transparent}
.tl li::before{content:"";position:absolute;left:-6px;top:.3rem;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--muted)}
.tl li.ev-status::before{border-color:var(--accent);background:var(--accent)}
.tl li.ev-resolve::before{border-color:var(--ok);background:var(--ok)}
.tl .when{font-size:.78rem;color:var(--muted)}
.tl .body{white-space:pre-wrap;overflow-wrap:anywhere}
.steps{display:flex;gap:0;margin:.25rem 0 1rem;overflow-x:auto}
.steps span{flex:1;min-width:90px;text-align:center;font-size:.78rem;padding:.35rem .3rem;border-bottom:3px solid var(--line);color:var(--muted);font-weight:600}
.steps span.done{border-color:var(--accent);color:var(--ink)}
.steps span.now{border-color:var(--ink);color:var(--ink)}

/* sign in */
.signin{min-height:100vh;display:grid;place-items:center;padding:1.5rem}
.signin .card{width:min(440px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:2rem}
.sso{display:flex;align-items:center;gap:.75rem;width:100%;padding:.75rem 1rem;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;font-weight:600;margin-bottom:.6rem;text-align:left}
a.sso{text-decoration:none;color:var(--ink)}
.sso:hover{background:var(--sunk)}
.sso small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
.drop{border:2px dashed var(--line);border-radius:var(--radius);padding:2rem;text-align:center;cursor:pointer;background:var(--surface)}
.drop.over{border-color:var(--accent);background:var(--info-bg)}
.toast{position:fixed;left:50%;bottom:calc(1.25rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:.6rem 1rem;border-radius:8px;font-size:.9rem;z-index:50;max-width:90vw}
.toast.bad{background:var(--bad);color:#fff}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:1.4rem;width:min(560px,94vw)}
dialog::backdrop{background:rgba(10,15,25,.45)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.chart svg{width:100%;height:auto;display:block}
.tgrid{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}@media (max-width:860px){.tgrid{grid-template-columns:1fr}}
/* support desk */
.main.wide{max-width:none;padding:1rem}
.desk{display:grid;grid-template-columns:320px minmax(0,1fr) 290px;height:calc(100dvh - 2rem);min-height:520px;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--surface)}
.desk.no-side{grid-template-columns:320px minmax(0,1fr)}
.dpane{min-width:0;min-height:0;display:flex;flex-direction:column}
.dlist{border-right:1px solid var(--line)}
.dside{border-left:1px solid var(--line);overflow:auto;padding:1rem;gap:1.25rem;background:var(--bg)}
.lhead{padding:1rem;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:.65rem}
.litems{overflow:auto;flex:1}
.titem{display:block;padding:.75rem 1rem;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.titem:hover{background:var(--sunk)}
.titem.on{background:var(--info-bg);box-shadow:inset 3px 0 0 var(--accent)}
.titem.unread b::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:.4rem;vertical-align:middle}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:.35rem}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:.3rem .7rem;font-size:.82rem;font-weight:600;cursor:pointer;color:var(--ink)}
.chip:hover{border-color:var(--ink)}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.thead{display:flex;gap:.75rem;align-items:center;padding:.8rem 1rem;border-bottom:1px solid var(--line)}
.back{display:none;text-decoration:none;font-size:1.3rem;color:var(--ink)}
.tbody{flex:1;overflow:auto;padding:1rem 1.25rem;display:flex;flex-direction:column;gap:.75rem;background:var(--bg)}
.msg{max-width:min(78%,640px);padding:.6rem .85rem;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-color:var(--accent);border-bottom-right-radius:4px}
.msg.me a{color:inherit}
.msg.them,.msg.bot{align-self:flex-start;border-bottom-left-radius:4px}
.msg.note{align-self:stretch;max-width:none;background:var(--warn-bg);border:1px dashed var(--warn)}
.msg .who{font-size:.75rem;font-weight:600;opacity:.85;margin-bottom:.15rem}
.msg .body{white-space:pre-wrap;overflow-wrap:anywhere}
.msg.bot .body{white-space:normal}
.msg .when{font-size:.7rem;opacity:.75;margin-top:.25rem;text-align:right}
.msg img{max-width:100%;max-height:260px;border-radius:8px;margin-top:.4rem;display:block}
.msg.me .assetsel{background:var(--surface);color:var(--ink);border-color:transparent;font-weight:600;max-width:100%}
.msg.me .assetsel:disabled{opacity:1}
.linkbtn{background:none;border:0;padding:0;color:inherit;text-decoration:underline;cursor:pointer;font-size:.72rem}
.badge{font-size:.66rem;background:var(--ink);color:var(--surface);border-radius:4px;padding:.05rem .3rem;font-weight:600;vertical-align:1px}
.sys{align-self:center;font-size:.75rem;color:var(--muted);text-align:center;max-width:90%}
.composer{border-top:1px solid var(--line);padding:.75rem 1rem;background:var(--surface);display:flex;flex-direction:column;gap:.5rem}
.composer textarea{width:100%;min-height:76px;max-height:240px;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:.55rem .65rem;background:var(--bg);color:var(--ink)}
.composer.internal textarea{background:var(--warn-bg);border-color:var(--warn)}
.banner{padding:.75rem 1rem;background:var(--ok-bg);border-top:1px solid var(--line)}
.acards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:.6rem}
.acard{border:1px solid var(--line);border-radius:10px;padding:.75rem;background:var(--surface);text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:.35rem;align-items:flex-start;color:var(--ink)}
button.acard:hover{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.sidesec h3{font-size:.8rem;color:var(--muted);margin:0 0 .4rem;font-weight:600}
.emptypane{margin:auto;text-align:center;color:var(--muted);padding:2rem;max-width:420px}
.pp{position:relative}
.pp-list{position:absolute;z-index:20;left:0;right:0;top:100%;margin-top:4px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 28px rgba(0,0,0,.14);max-height:260px;overflow:auto}
.pp-list button{display:block;width:100%;text-align:left;padding:.5rem .7rem;border:0;background:none;cursor:pointer;color:var(--ink)}
.pp-list button:hover{background:var(--sunk)}
dialog{overflow:visible}
@media (max-width:1100px){
  .desk,.desk.no-side{grid-template-columns:280px minmax(0,1fr);grid-template-rows:minmax(520px,calc(100dvh - 2rem)) auto;height:auto}
  .dside{grid-column:1/-1;border-left:0;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
}
@media (max-width:860px){
  .main.wide{padding:.5rem}
  .desk,.desk.no-side{grid-template-columns:1fr;grid-template-rows:minmax(460px,calc(100dvh - 9rem)) auto}
  .desk.has-thread .dlist{display:none}
  .desk:not(.has-thread) .dthread{display:none}
  .back{display:inline}
  .msg{max-width:88%}
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div id="root"><div class="signin"><p class="muted"><span class="spin"></span> Loading Asset Desk…</p></div></div>
<div id="toast" class="toast" hidden></div>
<dialog id="dlg"></dialog>

<script>
"use strict";
/* ============ constants ============ */
const ROLES = ["Admin","IT Manager","IT Asset Manager","Finance","IT Support","Employee"];
const PERMS = {
  "Admin":["assets.viewAll","assets.create","assets.edit","assets.import","assets.delete","depr.edit","report.view","tickets.viewAll","tickets.manage","tickets.raise","people.manage","settings.manage","exits.viewAll","sales.view","payroll.view"],
  "IT Manager":["assets.viewAll","report.view","tickets.viewAll","tickets.raise","exits.viewAll","exits.itApprove"],
  "IT Asset Manager":["assets.viewAll","assets.create","assets.edit","assets.assign","assets.import","report.view","tickets.viewAll","tickets.raise","exits.viewAll","returns.receive","sales.create"],
  "Finance":["assets.viewAll","depr.edit","report.view","tickets.raise","exits.viewAll","exits.financeApprove","sales.create","sales.approve","payroll.view"],
  "IT Support":["assets.viewAll","tickets.viewAll","tickets.manage","tickets.raise"],
  "Employee":["tickets.raise"]
};
const ROLE_NOTE = {
  "Admin":"Manages people, roles and settings, and can see every asset, request and exit clearance.",
  "IT Manager":"Signs off exit clearances after all assets are handed back.",
  "IT Asset Manager":"Adds assets, allocates them to employees, receives them back and proposes sales to employees.",
  "Finance":"Sets depreciation, approves asset sales to employees, runs the salary-deduction payroll input and gives the final exit sign-off.",
  "IT Support":"Answers support requests in the inbox and solves them.",
  "Employee":"Sees the assets allocated to them, gets IT help, and returns assets or submits an exit clearance."
};
const normRole = r => r==="Asset Manager" ? "IT Asset Manager" : r;
const CATEGORIES = {
  "Laptop":{life:3,wdv:40},"Desktop":{life:3,wdv:40},"Monitor":{life:5,wdv:40},"Mobile phone":{life:2,wdv:40},
  "Server":{life:6,wdv:40},"Network equipment":{life:5,wdv:40},"Printer / scanner":{life:5,wdv:15},
  "Office equipment":{life:5,wdv:15},"Furniture":{life:10,wdv:10},"Vehicle":{life:8,wdv:15},
  "Software license":{life:3,wdv:25},"Other":{life:5,wdv:15}
};
const METHODS = {SL:"Straight line",WDV:"Written-down value",DDB:"Double declining balance",SYD:"Sum of years' digits"};
const ASSET_STATUS = ["In stock","In use","Under repair","Retired","Disposed","Sold"];
const T_STATUS = ["New","Open","Pending","On-hold","Solved","Closed"];
const T_CATS = ["Hardware fault","Software issue","Physical damage","Lost or stolen","Replacement request","Access / setup","Other"];
const PRIORITY = {Critical:4,High:24,Medium:72,Low:168};

class ApiError extends Error { constructor(status, message){ super(message); this.status = status; this.code = status; } }
async function api(method, path, body, isForm, signal){
  const opt = { method, credentials:"same-origin", headers:{"X-Requested-With":"AssetDesk"}, signal };
  if (body !== undefined){
    if (isForm) opt.body = body;
    else { opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(body); }
  }
  let r;
  try{ r = await fetch(path, opt); }
  catch(e){ if (e.name==="AbortError") throw e; throw new ApiError(0, "Can't reach the server. Check your connection."); }
  const ct = r.headers.get("content-type")||"";
  const data = ct.includes("json") ? await r.json().catch(()=>null) : await r.text();
  if (r.status===401 && !path.startsWith("/api/state")){ S.session = null; showSignIn(); }
  if (!r.ok){
    const d = data && data.detail;
    const msg = typeof d==="string" ? d : Array.isArray(d) ? d.map(x=>x.msg).join("; ") : `Request failed (${r.status}).`;
    throw new ApiError(r.status, msg);
  }
  return data;
}

/* ============ depreciation engine ============ */
function yearlyDep(a){
  const cost = num(a.cost), salv = Math.min(num(a.salvage), cost), life = Math.max(1, Math.round(num(a.life)||1));
  const base = cost - salv, out = []; let open = cost;
  const m = a.method || "SL";
  if (m === "SL"){ for (let i=0;i<life;i++) out.push(base/life); }
  else if (m === "SYD"){ const s = life*(life+1)/2; for (let i=0;i<life;i++) out.push(base*(life-i)/s); }
  else if (m === "WDV"){
    let r = num(a.rate)/100;
    if (!r) r = 1 - Math.pow(Math.max(salv, cost*0.05)/Math.max(cost,1), 1/life);
    for (let i=0;i<life;i++){ let d = (i===life-1) ? open-salv : open*r; d = Math.max(0, Math.min(d, open-salv)); out.push(d); open -= d; }
  } else { // DDB with switch to straight line
    const r = 2/life;
    for (let i=0;i<life;i++){ const sl=(open-salv)/(life-i); let d=Math.max(open*r, sl); d=Math.max(0,Math.min(d,open-salv)); out.push(d); open-=d; }
  }
  return out;
}
function startOf(a){ const d = new Date(a.inServiceDate || a.purchaseDate || todayISO()); return isNaN(d) ? new Date() : d; }
function monthsBetween(a,b){ return (b.getFullYear()-a.getFullYear())*12 + (b.getMonth()-a.getMonth()) + (b.getDate()-a.getDate())/30.44; }
function accumAt(a, date){
  const ys = yearlyDep(a), total = ys.length*12;
  let m = Math.max(0, Math.min(total, monthsBetween(startOf(a), date)));
  if (["Disposed","Sold","Retired"].includes(a.status) && a.disposedAt) m = Math.min(m, Math.max(0, monthsBetween(startOf(a), new Date(a.disposedAt))));
  let acc = 0, i = 0;
  while (m > 0 && i < ys.length){ const take = Math.min(12, m); acc += ys[i]*take/12; m -= take; i++; }
  return acc;
}
const bookValue = (a, date=new Date()) => num(a.cost) - accumAt(a, date);
function schedule(a){
  const ys = yearlyDep(a), s = startOf(a); let open = num(a.cost), acc = 0;
  return ys.map((d,i)=>{
    const from = new Date(s); from.setFullYear(s.getFullYear()+i);
    const to = new Date(from); to.setFullYear(from.getFullYear()+1); to.setDate(to.getDate()-1);
    acc += d; const row = {year:i+1, from, to, open, dep:d, acc, close:open-d}; open -= d; return row;
  });
}
function fyRange(startYear){
  const m = (S.config.fyStartMonth||4)-1;
  return {start:new Date(startYear, m, 1), end:new Date(startYear+1, m, 1)};
}

function currentFYStart(){ const now=new Date(), m=(S.config.fyStartMonth||4)-1; return now.getMonth()>=m ? now.getFullYear() : now.getFullYear()-1; }

function bindAssets(){
  const upd = (k,el)=>{ S.filters[k] = el.value; const pos = el.selectionStart; render(); const n = $("#"+el.id); if(n){ n.focus(); if(pos!=null&&n.setSelectionRange) n.setSelectionRange(pos,pos);} };
  const aq=$("#aq"); if(aq) aq.oninput=()=>upd("assetQ",aq);
  const ac=$("#acat"); if(ac) ac.onchange=()=>upd("assetCat",ac);
  const as=$("#ast"); if(as) as.onchange=()=>upd("assetStatus",as);
  $$("tr[data-go]").forEach(tr=>tr.onclick=()=>go(tr.dataset.go));
  const ex=$("#exportAssets"); if(ex) ex.onclick=()=>{
    const rows=[["Tag","Name","Category","Serial","Vendor","Invoice","Location","Department","Assigned to","Status","Purchase date","In service","Cost","Salvage","Life (yrs)","Method","Accumulated depreciation","Book value"]];
    visibleAssets().forEach(a=>rows.push([a.id,a.name,a.category,a.serial,a.vendor,a.invoiceNumber,a.location,a.department,nameOf(a.assignedTo),a.status,a.purchaseDate,a.inServiceDate,num(a.cost),num(a.salvage),a.life,METHODS[a.method],accumAt(a,new Date()).toFixed(2),bookValue(a).toFixed(2)]));
    downloadCSV("asset-register-"+todayISO()+".csv", rows);
  };
}
async function downloadCSV(name, rows){
  const csv = rows.map(r=>r.map(v=>{ const s=String(v??""); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }).join(",")).join("\n");
  downloadFile(name, "\ufeff"+csv, "text/csv;charset=utf-8"); toast("Downloaded "+name);
}

function bvChart(a, sch){
  if (!sch.length || !num(a.cost)) return "";
  const W=520,H=170,pl=8,pr=8,pt=10,pb=24, cost=num(a.cost);
  const pts=[{t:startOf(a),v:cost},...sch.map(r=>({t:r.to,v:r.close}))];
  const t0=+pts[0].t,t1=+pts[pts.length-1].t, X=t=>pl+(W-pl-pr)*((+t-t0)/Math.max(1,t1-t0)), Y=v=>pt+(H-pt-pb)*(1-v/cost);
  const now=new Date(), nx = X(Math.min(Math.max(+now,t0),t1)), nv = Y(bookValue(a,now));
  const path=pts.map((p,i)=>(i?"L":"M")+X(p.t).toFixed(1)+","+Y(p.v).toFixed(1)).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Book value falls from ${money(cost)} to ${money(sch.at(-1).close)}">
    <line x1="${pl}" x2="${W-pr}" y1="${H-pb}" y2="${H-pb}" stroke="var(--line)"/>
    <path d="${path} L${X(t1)},${H-pb} L${X(t0)},${H-pb}Z" fill="var(--info-bg)"/>
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2"/>
    ${+now>=t0&&+now<=t1?`<line x1="${nx}" x2="${nx}" y1="${pt}" y2="${H-pb}" stroke="var(--ink)" stroke-dasharray="3 3"/><circle cx="${nx}" cy="${nv}" r="4" fill="var(--ink)"/><text x="${Math.min(nx+6,W-60)}" y="${Math.max(nv-6,12)}" font-size="11" fill="var(--ink)">Today</text>`:""}
    <text x="${pl}" y="${H-6}" font-size="11" fill="var(--muted)">${startOf(a).getFullYear()}</text>
    <text x="${W-pr}" y="${H-6}" font-size="11" fill="var(--muted)" text-anchor="end">${new Date(t1).getFullYear()}</text></svg>`;
}

function bindAssetForm(){

function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=()=>rej(new Error("Couldn't load "+src)); document.head.appendChild(s); }); }
async function pdfToImage(file){
  if (!window.pdfjsLib){
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js");
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js");
  }
  const pdf = await window.pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
  const page = await pdf.getPage(1), vp = page.getViewport({scale:2});
  const c = document.createElement("canvas"); c.width=vp.width; c.height=vp.height;
  await page.render({canvasContext:c.getContext("2d"), viewport:vp}).promise;
  return await new Promise(r=>c.toBlob(r,"image/png"));
}
async function startOCR(file){
  const okType = /^image\/(jpeg|png|webp)$/.test(file.type) || file.type==="application/pdf";
  if (!okType){ S.ocr={...S.ocr,status:"error",error:"That file type can't be read. Use JPG, PNG, WebP or PDF."}; render(); return; }
  S.ocr={status:"reading",file,result:null,error:"",blobId:null,stage:"Claude is reading the invoice…"}; render();
  ocrCtl = new AbortController();
  try{
    const fd = new FormData(); fd.append("file", file);
    const res = await api("POST", "/api/ocr", fd, true, ocrCtl.signal);
    const r = res.result;
    if (!r.items?.length){ S.ocr={status:"error",error:r.notes||"No line items were found. Try a clearer photo.",file:null,result:null,blobId:null}; render(); return; }
    S.ocr={status:"review",file,result:r,error:"",blobId:res.fileId}; render();
  }catch(e){
    S.ocr = e.name==="AbortError" ? {status:"idle",file:null,result:null,error:"",blobId:null} : {status:"error",error:e.message||"Reading failed. Try again.",file:null,result:null,blobId:null};
    render();
  }
}

    list.hidden = false; S.pick[pid] = {...(S.pick[pid]||{}), open:true};

      catch(err){ toast(err.message,true); } };
  };
  q.onfocus = show;
  q.oninput = ()=>{ S.pick[pid] = {id:null, text:q.value, open:true}; show(); };
  q.onblur = ()=>setTimeout(()=>{ if (document.activeElement?.id !== q.id){ list.hidden = true; if (S.pick[pid]) S.pick[pid].open = false; } }, 150);
  if (S.pick[pid]?.open) setTimeout(()=>{ if (document.activeElement?.id === q.id) show(); }, 0);
}

  const as=$("#alAsset"); if(as) as.onchange=()=>S.pick.alAsset=as.value;
  const ad=$("#alDate"); if(ad) ad.onchange=()=>S.pick.alDate=ad.value;
  const q=$("#alQ"); if(q) q.oninput=()=>{ S.filters.allocQ=q.value; render(); };
  const goB=$("#alGo"); if(goB) goB.onclick=async()=>{
    const a=S.assets.find(x=>x.id===$("#alAsset").value), to=S.pick.alPerson?.id;
    if(!to){ toast("Pick an employee from the list.",true); $("#alPerson-q").focus(); return; }
    goB.disabled=true;
    if(await allocate(a,to,$("#alDate").value,"")){ S.pick.alPerson={}; S.pick.alAsset=null; S.pick.alDate=null; }
    render();
  };
  $$("[data-realloc]").forEach(b=>b.onclick=()=>allocateDialog(S.assets.find(x=>x.id===b.dataset.realloc)));
  $$("[data-return]").forEach(b=>b.onclick=()=>returnDialog(S.assets.find(x=>x.id===b.dataset.return)));
}

/* ---------- support: chat help desk ---------- */
const PRI_LABEL = {Low:"It can wait", Medium:"It's slowing me down", High:"I can't work", Critical:"Several people are affected"};
function syncMsgWatch(){
  const want = S.route[0]==="support" && S.route[1] && S.route[1]!=="new" ? S.route[1] : null;
  if ((S.msgSub?.id||null) === want) return;
  if (S.msgSub){ clearInterval(S.msgSub.timer); S.msgSub = null; }
  if (!want) return;
  S.msgSub = {id:want, last:"", timer:setInterval(()=>{ if (document.visibilityState==="visible") reloadMsgs(want); }, 4000)};
  setTimeout(()=>reloadMsgs(want));
}
async function reloadMsgs(id){
  try{
    const l = await api("GET", `/api/tickets/${encodeURIComponent(id)}/messages`);
    if (S.msgSub?.id !== id) return;
    const js = JSON.stringify(l);
    if (js !== S.msgSub.last){ S.msgSub.last = js; S.msgs[id] = l; render(); }
  }catch{}
}
const myHelpAssets = () => S.assets.filter(a=>a.assignedTo===S.me?.id && !["Disposed","Retired"].includes(a.status))
  .sort((x,y)=>String(x.allocatedAt||"").localeCompare(String(y.allocatedAt||"")));
const serialLabel = a => a.serial ? a.serial : "No serial";
function initNewRequest(assetId){
  const mine = myHelpAssets();
  const pick = mine.find(a=>a.id===assetId) || mine[0];
  S.nr = {assetId: pick ? pick.id : null, category:null, priority:"Medium", subject:"", body:"", file:null, sending:false};
}
function supportView(){
  const agent = can("tickets.manage"), id = S.route[1], isNew = id==="new";
  if (!can("tickets.raise") && !agent) return denied();
  if (isNew && !S.nr) initNewRequest(S.route[2]);
  const t = id && !isNew ? S.tickets.find(x=>x.id===id) : null;
  const allowed = t && (can("tickets.viewAll") || t.requesterId===S.me.id || t.assigneeId===S.me.id);
  let pane;
  if (isNew) pane = newRequestPane();
  else if (t && allowed) pane = threadPane(t);
  else if (t) pane = `<div class="emptypane">You don't have access to ${esc(id)}.</div>`;
  else if (id) pane = S.loaded.tickets ? `<div class="emptypane">Request ${esc(id)} wasn't found. <a href="#/support">Back</a></div>` : `<div class="emptypane"><span class="spin"></span></div>`;
  else pane = `<div class="emptypane"><p style="font-size:1.05rem;color:var(--ink);font-weight:600;margin-bottom:.35rem">${agent?"Pick a request from the queue":"Need help with a laptop, phone or other asset?"}</p>
    <p>${agent?"Replies you send here appear in the employee's chat straight away.":myHelpAssets().length?"Start a chat with IT support about one of your assets. Your asset's serial number is picked for you.":"You can raise requests on assets allocated to you. You don't have any yet."}</p>
    ${!agent&&myHelpAssets().length?`<a class="btn primary" href="#/support/new">New request</a>`:""}</div>`;
  const side = t && allowed ? `<aside class="dpane dside">${ticketSide(t)}</aside>` : "";
  return `<div class="desk ${id?"has-thread":""} ${side?"":"no-side"}">
    <section class="dpane dlist">${agent ? inboxList() : requesterList()}</section>
    <section class="dpane dthread">${pane}</section>${side}</div>`;
}
function ticketRow(t, agent){

function inboxList(){
  const all = visibleTickets(), f = S.filters, q = f.inboxQ.toLowerCase();
  const views = [
    ["unassigned","Unassigned", t=>isActive(t) && !t.assigneeId],
    ["mine","Mine", t=>isActive(t) && t.assigneeId===S.me.id],
    ["open","All open", isActive],
    ["waiting","Pending & on-hold", t=>["Pending","On-hold"].includes(t.status)],
    ["solved","Solved", t=>!isActive(t)]];
  const v = views.find(x=>x[0]===f.inboxView) || views[0];
  const rank = {Critical:0,High:1,Medium:2,Low:3};
  const list = all.filter(v[2]).filter(t=>!q || [t.id,t.subject,t.assetTag,t.assetName,ticketSerial(t),plainName(t.requesterId)].join(" ").toLowerCase().includes(q))
    .sort((a,b)=> v[0]==="solved" ? String(b.solvedAt||b.lastMessageAt).localeCompare(String(a.solvedAt||a.lastMessageAt))
      : (isOverdue(b)-isOverdue(a)) || (rank[a.priority]-rank[b.priority]) || String(a.dueAt).localeCompare(String(b.dueAt)));
  return `<div class="lhead"><div class="row"><h2 style="margin:0">Support inbox</h2><span class="spacer"></span>${myHelpAssets().length?`<a class="btn" href="#/support/new" style="padding:.3rem .65rem">New</a>`:""}</div>
    <div class="chips">${views.map(([k,l,fn])=>`<button class="chip${v[0]===k?" on":""}" data-view="${k}">${l} ${all.filter(fn).length}</button>`).join("")}</div>
    <input class="inp" id="inboxQ" placeholder="Search requests…" value="${esc(f.inboxQ)}"></div>
  <div class="litems">${S.loaded.tickets ? (list.map(t=>ticketRow(t,true)).join("") || `<div class="empty small">No requests in this view.</div>`) : `<div class="empty"><span class="spin"></span></div>`}</div>`;
}
function requesterList(){
  const mine = S.tickets.filter(t=>t.requesterId===S.me.id), f = S.filters;
  const list = mine.filter(t=>f.reqView==="open"?isActive(t):!isActive(t)).sort((a,b)=>String(b.lastMessageAt).localeCompare(String(a.lastMessageAt)));
  return `<div class="lhead"><div class="row"><h2 style="margin:0">My requests</h2><span class="spacer"></span>${myHelpAssets().length?`<a class="btn primary" href="#/support/new" style="padding:.35rem .7rem">New request</a>`:""}</div>
    <div class="chips"><button class="chip${f.reqView==="open"?" on":""}" data-req="open">Open ${mine.filter(isActive).length}</button><button class="chip${f.reqView==="done"?" on":""}" data-req="done">Solved ${mine.filter(t=>!isActive(t)).length}</button></div></div>
  <div class="litems">${list.map(t=>ticketRow(t,false)).join("") || `<div class="empty small">${f.reqView==="open"?"No open requests.":"Nothing solved yet."}</div>`}</div>`;
}

async function submitRequest(){
  const nr = S.nr, body = nr.body.trim();
  if (body.length < 5){ toast("Describe the problem in a few words.", true); $("#nrBody")?.focus(); return; }
  const a = myHelpAssets().find(x=>x.id===nr.assetId);
  if (!a){ toast("You can only raise requests on assets allocated to you.", true); return; }
  nr.sending = true; render();
  let attachmentId = null;
  if (nr.file){ try{ attachmentId = (await uploadFile(nr.file)).id; }catch(e){ toast("The photo couldn't be uploaded, so it was left out.", true); } }
  try{
    const t = await api("POST", "/api/tickets", {assetId:a.id, category:nr.category, priority:nr.priority, subject:nr.subject.trim(), body, attachmentId});
    Seen.mark(t.id, t.lastMessageAt); S.nr = null;
    await refresh(true); toast(`Sent — request ${t.id} is with IT support`); go("support/"+t.id);
  }catch(e){ nr.sending = false; render(); toast(e.message, true); }
}

  if (m.kind==="system") return `<div class="sys">${esc(m.body)} · ${fmtDT(m.at)}</div>`;
  const agentSees = can("tickets.manage");
  if (m.kind==="internal" && !agentSees) return "";
  const mine = m.by===S.me.id, fromIT = m.by!==t.requesterId;
  const cls = m.kind==="internal" ? "note" : mine ? "me" : "them";
  let att = "";
  if (m.attachment?.id){ const u = "/files/"+encodeURIComponent(m.attachment.id);
    att = /^image\//.test(m.attachment.type||"") ? `<a href="${u}" target="_blank" rel="noopener"><img src="${u}" alt="${esc(m.attachment.name||"Attachment")}"></a>` : `<a href="${u}" target="_blank" rel="noopener">📎 ${esc(m.attachment.name||"Attachment")}</a>`; }
  return `<div class="msg ${cls}"><div class="who">${esc(nameOf(m.by))}${fromIT&&m.kind!=="internal"?' <span class="badge">IT support</span>':""}${m.kind==="internal"?" · internal note, only IT sees this":""}</div><div class="body">${esc(m.body)}</div>${att}<div class="when">${fmtDT(m.at)}</div></div>`;
}

const ticketSerial = t => t.assetSerial || (t.assetId && S.assets.find(a=>a.id===t.assetId)?.serial) || "";
function ticketSide(t){

  const agents = agentIds(); if (t.assigneeId && !agents.includes(t.assigneeId)) agents.push(t.assigneeId);
  requestProfiles(agents);
  const mins = (x,y)=>{ const m=Math.round((new Date(y)-new Date(x))/60000); return m<60?m+" min":m<1440?(m/60).toFixed(1)+" h":(m/1440).toFixed(1)+" days"; };
  return `<div class="sidesec"><h3>Requester</h3><b>${esc(plainName(t.requesterId))}</b><div class="small muted">${reqOpen} open request${reqOpen===1?"":"s"}</div></div>
  <div class="sidesec"><h3>Asset</h3>${a?`<a href="#/asset/${esc(a.id)}">${tagHTML(a.id)}</a><div style="margin-top:.35rem"><b>${esc(a.name)}</b></div>
      <dl class="kv small" style="margin-top:.35rem"><dt>Serial</dt><dd><b>${esc(ticketSerial(t)||"—")}</b>${t.assetSerial&&a.serial&&t.assetSerial!==a.serial?` <span class="small muted">(now ${esc(a.serial)})</span>`:""}</dd><dt>Status</dt><dd>${statusPill(a.status)}</dd><dt>With</dt><dd>${esc(a.assignedTo?plainName(a.assignedTo):"In stock")}</dd><dt>Since</dt><dd>${fmtDT(a.allocatedAt)}</dd><dt>History</dt><dd>${onAsset} other request${onAsset===1?"":"s"}</dd></dl>
      ${agent&&isActive(t)&&!["Retired","Disposed"].includes(a.status)?`<label class="check small" style="margin-top:.5rem"><input type="checkbox" id="repairChk" ${a.status==="Under repair"?"checked":""}> Asset is under repair</label>`:""}`
    :`<span class="muted small">${esc(t.assetName||"General request")}</span>`}</div>
  <div class="sidesec"><h3>Request</h3><dl class="kv small"><dt>Type</dt><dd>${esc(t.category||"—")}</dd><dt>Raised</dt><dd>${fmtDT(t.createdAt)}</dd>

      ${t.assigneeId!==S.me.id?`<button class="btn" id="takeIt" style="margin-top:.5rem;width:100%;justify-content:center">Assign to me</button>`:""}

    :`<dl class="kv small" style="margin-top:.35rem"><dt>Assignee</dt><dd>${esc(t.assigneeId?plainName(t.assigneeId):"Not yet assigned")}</dd><dt>Priority</dt><dd>${priPill(t.priority)}</dd></dl>`}
  </div>`;

async function setAssetRepair(t, on){
  return act(api("POST", `/api/tickets/${t.id}/repair`, {on}), on ? "Asset marked under repair" : "Asset back in service");
}
async function agentSend(t){
  const body = (S.drafts[t.id]||"").trim(), mode = S.replyMode[t.id]||"public", st = $("#submitAs").value;
  if (!body && st===t.status){ toast("Write a reply first.", true); return; }
  if (st==="Solved" && !(body && mode==="public")){ toast("Tell the employee what fixed it before marking it solved.", true); return; }
  if (st==="Pending" && !(body && mode==="public")){ toast("Ask the employee your question in a reply before setting Pending.", true); return; }
  $("#sendBtn").disabled = true;
  const res = await act(api("POST", `/api/tickets/${t.id}/messages`, {body, kind:mode, status:st}),
    st==="Solved" ? `${t.id} solved — the employee has been asked to confirm` : mode==="internal" ? "Note added" : "Reply sent");
  if (res){ S.drafts[t.id] = ""; S.scrollToEnd = true; Seen.mark(t.id, res.lastMessageAt); reloadMsgs(t.id); }
  render();
}
async function requesterSend(t){
  const body = (S.drafts[t.id]||"").trim(), file = S.att[t.id];
  if (!body && !file){ toast("Write a message first.", true); return; }
  $("#sendBtn").disabled = true;
  let attachmentId = null;
  if (file){ try{ attachmentId = (await uploadFile(file)).id; }catch(e){ toast("The attachment couldn't be uploaded.", true); } }
  const res = await act(api("POST", `/api/tickets/${t.id}/messages`, {body, kind:"public", attachmentId}));
  if (res){ S.drafts[t.id] = ""; S.att[t.id] = null; S.scrollToEnd = true; Seen.mark(t.id, res.lastMessageAt); reloadMsgs(t.id); }
  render();
}
async function suggestReply(t){
  if (S.suggest) return;
  S.suggest = {abort(){}}; render();
  try{ const r = await api("POST", `/api/tickets/${t.id}/suggest`, {}); S.drafts[t.id] = r.text; S.replyMode[t.id] = "public"; }
  catch(e){ toast(e.message, true); }
  S.suggest = null; render();
}
function bindSupport(){

const EXIT_STAGES = ["Asset handover","IT manager review","Finance review","Cleared"];
const RETURN_STAGES = ["Awaiting handover","Completed"];
const CLOSED_STAGES = ["Cleared","Completed","Withdrawn"];
const EXIT_REASONS = ["Resignation","Retirement","End of contract","Termination","Other"];
const RETURN_REASONS = ["Routine return","No longer needed","Getting a replacement","Faulty or damaged","Moving role or team","Other"];

const isOpenR = r => !CLOSED_STAGES.includes(r.stage);
function visibleReturns(){ return can("exits.viewAll") ? S.returns : S.returns.filter(r=>r.employeeId===S.me.id); }
function openReturnFor(assetId){ return S.returns.find(r=>isOpenR(r) && (r.items||[]).some(i=>i.assetId===assetId && i.state==="Pending")); }
function myOpenExit(){ return S.returns.find(r=>r.type==="exit" && r.employeeId===S.me.id && isOpenR(r)); }
function waitingOnMe(r){
  if (!isOpenR(r) || r.employeeId===S.me.id) return false; // nobody clears their own return
  if (r.stage==="Asset handover"||r.stage==="Awaiting handover") return can("returns.receive");
  if (r.stage==="IT manager review") return can("exits.itApprove");
  if (r.stage==="Finance review") return can("exits.financeApprove");
  return false;
}
function stagePill(st){ const c={"Asset handover":"p-warn","Awaiting handover":"p-warn","IT manager review":"p-info","Finance review":"p-info","Cleared":"p-ok","Completed":"p-ok","Withdrawn":"p-mute"}[st]||"p-mute"; return `<span class="pill ${c}">${esc(st)}</span>`; }
function itemState(i){
  if (i.state==="Pending") return '<span class="pill p-warn">To be handed over</span>';
  if (i.state==="Missing") return '<span class="pill p-bad">Not returned</span>';
  return `<span class="pill ${i.condition==="Damaged"?"p-warn":"p-ok"}">Received${i.condition==="Damaged"?" · damaged":""}</span>`;
}
function undeclaredFor(r){
  if (r.type!=="exit" || !isOpenR(r)) return [];
  const listed = new Set((r.items||[]).map(i=>i.assetId).filter(Boolean));
  return S.assets.filter(a=>a.assignedTo===r.employeeId && !listed.has(a.id));
}
function assetItem(a){ return {key:"a-"+a.id, kind:"asset", assetId:a.id, tag:a.id, name:a.name, serial:a.serial||"", cost:num(a.cost), bookValue:Math.round(bookValue(a)), state:"Pending", condition:"", recovery:0, note:""}; }

function assetEvents(a){

  allocs.forEach(x=>{

    ev.push({at:l.at, type:/^Signed for/.test(l.text)?"Signed for":/repair|Back in service/i.test(l.text)?"Repair":/^Sold/.test(l.text)?"Sold":"Updated", text:l.text, by:l.by});
  });
  S.tickets.filter(t=>t.assetId===a.id).forEach(t=>{

    if (t.solvedAt) ev.push({at:t.solvedAt, type:"Solved", text:`${t.id} solved${t.resolution?": "+t.resolution:""}`, by:t.assigneeId, link:"support/"+t.id});
  });

  }));
  S.sales.filter(s=>s.assetId===a.id).forEach(s=>{
    ev.push({at:s.createdAt, type:"Sale offered", text:`${s.id}: offered to ${plainName(s.employeeId)} for ${money(s.price)} over ${s.instalments} month${s.instalments>1?"s":""}`, by:s.createdBy, link:"sales/"+s.id});

  });
  return ev.filter(e=>e.at).sort((x,y)=>String(new Date(x.at).toISOString()).localeCompare(new Date(y.at).toISOString()));

function payrollLines(month){
  const lines = [];
  S.sales.filter(s=>s.stage==="Sold").forEach(s=>(s.schedule||[]).forEach((i,ix)=>{ if (i.month===month) lines.push({kind:"sale", ref:s.id, ix, employeeId:s.employeeId,
    what:`Asset purchase — ${s.name}, serial ${s.serial||"—"} (instalment ${i.no} of ${s.instalments})`, amount:num(i.amount), status:i.status, link:"sales/"+s.id}); }));
  S.returns.filter(r=>r.type==="exit" && r.stage==="Cleared" && num(r.signoffs?.finance?.deduction)>0 && r.lastDay && r.lastDay.slice(0,7)===month).forEach(r=>lines.push({kind:"exit", ref:r.id, employeeId:r.employeeId,
    what:`Full and final settlement deduction — exit clearance ${r.id}`, amount:num(r.signoffs.finance.deduction), status:r.ffStatus||"Scheduled", link:"exits/"+r.id}));
  return lines.sort((a,b)=>plainName(a.employeeId).localeCompare(plainName(b.employeeId)));
}

function reportView(){

  const rows=S.assets.filter(a=>startOf(a)<end).map(a=>{ const o=accumAt(a,start), c=accumAt(a,end)-o; return {a,open:o,charge:c,close:o+c,nbv:num(a.cost)-o-c}; });
  const tot=rows.reduce((s,r)=>({cost:s.cost+num(r.a.cost),open:s.open+r.open,charge:s.charge+r.charge,close:s.close+r.close,nbv:s.nbv+r.nbv}),{cost:0,open:0,charge:0,close:0,nbv:0});
  const byCat={}; rows.forEach(r=>{ const k=r.a.category||"Other"; byCat[k]=byCat[k]||{cost:0,charge:0,nbv:0,n:0}; byCat[k].cost+=num(r.a.cost); byCat[k].charge+=r.charge; byCat[k].nbv+=r.nbv; byCat[k].n++; });

  <h2>By category</h2><div class="tablewrap" style="margin-bottom:1.5rem"><table><thead><tr><th>Category</th><th class="num">Assets</th><th class="num">Cost</th><th class="num">Charge</th><th class="num">Net block</th></tr></thead><tbody>

    ${provBlock("microsoft",`<label class="f">Tenant ID (for reference)<input name="microsoft.tenantId" value="${esc(c.microsoft?.tenantId||"")}" placeholder="00000000-0000-0000-0000-000000000000"></label>
      <label class="f" style="grid-column:1/-1">Entra ID group → role (one per line, applied at first sign-in to people without a role)<textarea name="microsoft.groupRoles" placeholder="3f1c…-group-object-id = IT Support">${esc(c.microsoft?.groupRoles||"")}</textarea></label>`)}
    ${provBlock("google")}
    <section class="panel"><h2>Register</h2><div class="grid g3">
      <label class="f">Currency<select name="currency">${["INR","USD","EUR","GBP","AED","SGD","AUD","JPY"].map(x=>`<option ${c.currency===x?"selected":""}>${x}</option>`).join("")}</select></label>
      <label class="f">Financial year starts<select name="fyStartMonth">${Array.from({length:12},(_,i)=>`<option value="${i+1}" ${+c.fyStartMonth===i+1?"selected":""}>${new Date(2000,i,1).toLocaleString(undefined,{month:"long"})}</option>`).join("")}</select></label>
      <label class="f">Default depreciation method<select name="defaultMethod">${Object.entries(METHODS).map(([k,v])=>`<option value="${k}" ${c.defaultMethod===k?"selected":""}>${v}</option>`).join("")}</select></label>
    </div></section>
    <div class="row"><span class="spacer"></span><button class="btn primary" type="submit">Save settings</button></div>
  </form>`;
}
function bindSettings(){
  const f=$("#setForm"); if(!f) return;
  f.onsubmit=async ev=>{ ev.preventDefault();
    const c=structuredClone(S.config); c.microsoft={...c.microsoft,enabled:false}; c.google={...c.google,enabled:false};
    new FormData(f).forEach((v,k)=>{ const [a,b]=k.split("."); if(b){ c[a][b]= b==="enabled"?true:b==="groupRoles"?String(v):String(v).trim().replace(/^@/,""); } else c[a]= a==="fyStartMonth"?+v:v; });
    if(!c.microsoft.enabled && !c.google.enabled){ toast("Keep at least one sign-in provider enabled.",true); return; }
    await act(api("PUT","/api/config",c),"Settings saved");
  };
}
/* ============ boot ============ */
async function boot(){
  parseRoute();
  try{ await refresh(true); }
  catch(e){ if (e.status===401) return showSignIn(); $("#root").innerHTML = `<div class="signin"><div class="card"><h1>Can't load Asset Desk</h1><p class="muted">${esc(e.message)}</p><button class="btn" onclick="location.reload()">Try again</button></div></div>`; return; }
  if (location.search.includes("signin_error")) history.replaceState(null, "", location.pathname+location.hash);
  setInterval(()=>{ if (document.visibilityState==="visible" && S.session) refresh().catch(()=>{}); }, 15000);
  document.addEventListener("visibilitychange", ()=>{ if (document.visibilityState==="visible" && S.session) refresh().catch(()=>{}); });
}
boot();
</script>
