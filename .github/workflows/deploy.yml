name: Asset Desk CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Test Asset Desk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create CI environment
        run: |
          cat > backend/.env <<'EOF'
          DATABASE_URL=mysql+pymysql://assetdesk:ci-password@db:3306/assetdesk?charset=utf8mb4
          SECRET_KEY=ci-test-secret-key
          BASE_URL=http://localhost:8000
          ADMIN_EMAILS=admin@acme.test
          UPLOAD_DIR=/data/uploads
          DEV_LOGIN=true
          COOKIE_SECURE=false
          MS_TENANT_ID=
          MS_CLIENT_ID=
          MS_CLIENT_SECRET=
          GOOGLE_CLIENT_ID=
          GOOGLE_CLIENT_SECRET=
          ANTHROPIC_API_KEY=
          ANTHROPIC_MODEL=claude-sonnet-5-5
          EOF

      - name: Start CI stack
        run: |
          DB_PASSWORD=ci-password \
          DB_ROOT_PASSWORD=ci-root-password \
          docker compose up -d --build

      - name: Wait for application
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8000/ >/dev/null 2>&1; then
              echo "Application is ready"
              exit 0
            fi

            echo "Waiting for application..."
            sleep 3
          done

          echo "Application did not become ready"
          docker compose ps
          docker compose logs
          exit 1

      - name: Run smoke tests
        run: |
          docker compose exec -T app \
            python tests/smoke_test.py

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs

      - name: Stop CI stack
        if: always()
        run: |
          docker compose down -v

  deploy:
    name: Deploy to Hosticare VPS
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Deploy through SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}

        run: |
          set -e

          echo "========================================"
          echo "Checking deployment configuration"
          echo "========================================"

          if [ -z "$DEPLOY_HOST" ]; then
            echo "ERROR: DEPLOY_HOST is empty"
            exit 1
          fi

          if [ -z "$DEPLOY_PORT" ]; then
            echo "ERROR: DEPLOY_PORT is empty"
            exit 1
          fi

          if [ -z "$DEPLOY_USER" ]; then
            echo "ERROR: DEPLOY_USER is empty"
            exit 1
          fi

          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "ERROR: DEPLOY_SSH_KEY is empty"
            exit 1
          fi

          echo "DEPLOY_HOST: $DEPLOY_HOST"
          echo "DEPLOY_PORT: $DEPLOY_PORT"
          echo "DEPLOY_USER: $DEPLOY_USER"
          echo "SSH key: present"

          echo "========================================"
          echo "Preparing SSH"
          echo "========================================"

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"

          echo "SSH key written successfully"

          echo "========================================"
          echo "Adding server to known_hosts"
          echo "========================================"

          ssh-keyscan \
            -p "$DEPLOY_PORT" \
            -H "$DEPLOY_HOST" \
            >> "$HOME/.ssh/known_hosts"

          chmod 644 "$HOME/.ssh/known_hosts"

          echo "Server host key added"

          echo "========================================"
          echo "Testing SSH authentication"
          echo "========================================"

          ssh \
            -p "$DEPLOY_PORT" \
            -i "$HOME/.ssh/deploy_key" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "echo 'SSH authentication successful'"

          echo "========================================"
          echo "SSH connection successful"
          echo "========================================"

          echo "Checking Asset Desk directory..."

          ssh \
            -p "$DEPLOY_PORT" \
            -i "$HOME/.ssh/deploy_key" \
            -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "if [ -d /opt/asset-desk ]; then echo '/opt/asset-desk exists'; else echo '/opt/asset-desk does not exist yet'; fi"

          echo "========================================"
          echo "Deployment stage reached successfully"
          echo "========================================"