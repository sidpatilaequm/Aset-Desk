name: Asset Desk CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Test Asset Desk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create CI environment
        run: |
          cat > backend/.env <<'EOF'
          DATABASE_URL=mysql+pymysql://assetdesk:ci-password@db:3306/assetdesk?charset=utf8mb4
          SECRET_KEY=ci-test-secret-key
          BASE_URL=http://localhost:8000
          ADMIN_EMAILS=admin@acme.test
          UPLOAD_DIR=/data/uploads
          DEV_LOGIN=true
          COOKIE_SECURE=false
          MS_TENANT_ID=
          MS_CLIENT_ID=
          MS_CLIENT_SECRET=
          GOOGLE_CLIENT_ID=
          GOOGLE_CLIENT_SECRET=
          ANTHROPIC_API_KEY=
          ANTHROPIC_MODEL=claude-sonnet-5-5
          EOF

      - name: Start CI stack
        run: |
          DB_PASSWORD=ci-password \
          DB_ROOT_PASSWORD=ci-root-password \
          docker compose up -d --build

      - name: Wait for application
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8000/ >/dev/null 2>&1; then
              echo "Application is ready"
              exit 0
            fi

            echo "Waiting for application..."
            sleep 3
          done

          echo "Application did not become ready"
          docker compose ps
          docker compose logs
          exit 1

      - name: Run smoke tests
        run: |
          docker compose exec -T app \
            python tests/smoke_test.py

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs

      - name: Stop CI stack
        if: always()
        run: |
          docker compose down -v

  deploy:
    name: Deploy Asset Desk
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy Asset Desk to VPS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}

        run: |
          set -e

          echo "========================================"
          echo "Checking deployment configuration"
          echo "========================================"

          test -n "$DEPLOY_HOST" || {
            echo "ERROR: DEPLOY_HOST is empty"
            exit 1
          }

          test -n "$DEPLOY_PORT" || {
            echo "ERROR: DEPLOY_PORT is empty"
            exit 1
          }

          test -n "$DEPLOY_USER" || {
            echo "ERROR: DEPLOY_USER is empty"
            exit 1
          }

          test -n "$DEPLOY_SSH_KEY" || {
            echo "ERROR: DEPLOY_SSH_KEY is empty"
            exit 1
          }

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"

          ssh-keyscan \
            -p "$DEPLOY_PORT" \
            -H "$DEPLOY_HOST" \
            >> "$HOME/.ssh/known_hosts"

          chmod 644 "$HOME/.ssh/known_hosts"

          echo "========================================"
          echo "Testing SSH"
          echo "========================================"

          ssh \
            -p "$DEPLOY_PORT" \
            -i "$HOME/.ssh/deploy_key" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "echo 'SSH authentication successful'"

          echo "========================================"
          echo "Preparing Asset Desk directory"
          echo "========================================"

          ssh \
            -p "$DEPLOY_PORT" \
            -i "$HOME/.ssh/deploy_key" \
            -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" << 'REMOTE'
          set -e

          if [ ! -d /opt/asset-desk ]; then
            mkdir -p /opt/asset-desk
            echo "Created /opt/asset-desk"
          else
            echo "/opt/asset-desk already exists"
          fi

          cd /opt/asset-desk

          if [ ! -d .git ]; then
            echo "Cloning Asset Desk repository..."

            git clone \
              https://github.com/sidpatilaequm/Aset-Desk.git \
              .

          else
            echo "Repository already exists"
            git fetch origin
            git reset --hard origin/main
          fi

          echo "Current commit:"
          git rev-parse --short HEAD

          echo "Repository deployment files:"
          ls -la

          echo "Backend:"
          ls -la backend || true

          echo "Database:"
          ls -la database || true
          REMOTE

          echo "========================================"
          echo "Repository deployed successfully"
          echo "========================================"